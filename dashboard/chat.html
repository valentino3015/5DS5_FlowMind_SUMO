<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlowMind · Assistant</title>
<style>
:root{font:15px 'Segoe UI',Arial,sans-serif;color:#203c48;background:#f1f6f7}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column}header{background:#123440;color:#fff;padding:22px 4%;display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:25px;margin:4px 0}header small{color:#aed5dc}nav{display:flex;gap:8px;background:#fff;padding:14px 4%;border-bottom:1px solid #d9e4e7;flex-wrap:wrap}nav a{padding:10px 22px;text-decoration:none;border-radius:8px;color:#3e626f}nav a.active{background:#087e8b;color:white}
main{flex:1;width:100%;max-width:1450px;margin:auto;padding:26px;display:grid;grid-template-columns:340px minmax(0,1fr);gap:22px;min-height:0}
.panel{background:white;border:1px solid #dce6e9;border-radius:14px;padding:22px}h2{font-size:19px;margin:0 0 14px}.note{font-size:13px;color:#637e88;line-height:1.6}label{display:block;font-weight:600;font-size:13px;margin:0 0 6px}
select,textarea{width:100%;border:1px solid #c5d6dc;border-radius:7px;padding:10px;background:#fff;font:inherit;color:inherit}button{padding:11px 18px;border:0;border-radius:8px;background:#087e8b;color:#fff;font:inherit;font-weight:600;cursor:pointer}button:disabled{opacity:.45;cursor:default}button.secondary{background:#e8f0f3;color:#345765}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.fact{background:#f0f6f8;border-radius:9px;padding:10px 12px}.fact b{display:block;font-size:17px;margin-top:2px}.fact span{font-size:12px;color:#637e88}
.suggestions{display:flex;flex-direction:column;gap:8px;margin-top:10px}.suggestions button{text-align:left;font-weight:500;background:#e8f0f3;color:#2c5160;padding:10px 12px}
.conversation{display:flex;flex-direction:column;min-height:70vh}.log{flex:1;overflow:auto;padding:4px 2px;min-height:300px}.empty{color:#637e88;text-align:center;margin-top:12vh;line-height:1.7}
.bubble{max-width:860px;white-space:pre-wrap;overflow-wrap:anywhere;padding:16px 18px;border-radius:12px;margin:12px 0;line-height:1.7;font-size:15.5px}.bubble.user{background:#e1f4ef;margin-left:auto;max-width:640px}.bubble.assistant{background:#f0f6f8}.bubble .who{display:block;font-size:12px;font-weight:700;color:#4b6d79;margin-bottom:4px}.bubble .meta{display:block;font-size:12px;color:#7a929b;margin-top:8px}
.waiting{color:#4b6d79;font-style:italic}.composer{display:flex;gap:10px;align-items:flex-end;border-top:1px solid #e3ecef;padding-top:16px}.composer textarea{resize:vertical;min-height:52px;max-height:200px}.error{color:#a6372e;white-space:pre-wrap;margin:8px 0 0}
@media(max-width:900px){main{grid-template-columns:1fr;padding:16px}.conversation{min-height:60vh}}
@media(max-width:560px){.composer{flex-direction:column;align-items:stretch}.facts{grid-template-columns:1fr}}
</style></head><body>
<header><div><small>TRAFFIC SIMULATION</small><h1>FlowMind</h1></div><div class="note" style="color:#aed5dc">Gemini explanation assistant · read only</div></header>
<nav><a href="/simulation">Simulation</a><a href="/history">Metrics history</a><a href="/chat" class="active">Assistant</a></nav>
<main>
<aside class="panel">
  <h2>Simulation to explain</h2>
  <label for="run">Pick from the history</label>
  <select id="run"></select>
  <p class="note" id="runInfo"></p>
  <div class="facts" id="facts"></div>
  <h2 style="margin-top:20px">Suggested questions</h2>
  <div class="suggestions" id="suggestions"></div>
</aside>
<section class="panel conversation">
  <h2 id="title">Conversation</h2>
  <div id="log" class="log" role="log" aria-live="polite"><p class="empty" id="empty">Pick a simulation, then ask a question.<br>The assistant only explains the recorded measurements of that simulation.</p></div>
  <form id="form" class="composer">
    <div style="flex:1"><label for="question">Your question</label><textarea id="question" maxlength="2000" rows="2" placeholder="What do the results of this simulation show?"></textarea></div>
    <button id="send" type="submit">Send</button>
    <button id="clear" type="button" class="secondary">Clear</button>
  </form>
  <p id="error" class="error" role="alert"></p>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const names={orchestrated:'FlowMind system',emission_model:'Emission RL model',rules:'Emission rules',fixed_time:'No agent (fixed-time lights)',interactive:'Methods changed during the run',flow_heuristic:'Flow only',flow_model:'Trained Flow',max_pressure:'MaxPressure'};
const statuses={completed:'Finished',stopped:'Stopped',failed:'Failed',running:'Running'};
const SUGGESTIONS=['Summarise the results of this simulation in three sentences.','How many vehicles departed, arrived and were still in the network at the end?','What do the measured waiting and CO₂ mean?','Does the CO₂ stand for fuel consumption?','What limits should I keep in mind when reading these numbers?'];
let runs=[],runId=null,history=[],busy=false;
const fmt=(v,d=2)=>v==null||Number.isNaN(+v)?'—':(+v).toLocaleString('en-GB',{maximumFractionDigits:d});
const when=r=>{const t=r.created_utc?new Date(r.created_utc):null;return t&&!isNaN(t)?t.toLocaleString('en-GB',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):r.run_id;};
async function post(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-FlowMind':'dashboard'},body:JSON.stringify(data)});let d={};try{d=await r.json();}catch(e){}if(!r.ok)throw Error(d.error||'Server error ('+r.status+')');return d;}
function bubble(role,text,meta){$('empty')?.remove();const el=document.createElement('div');el.className='bubble '+role;const who=document.createElement('span');who.className='who';who.textContent=role==='user'?'You':'FlowMind assistant';el.append(who,document.createTextNode(text));if(meta){const m=document.createElement('span');m.className='meta';m.textContent=meta;el.append(m);}$('log').append(el);$('log').scrollTop=$('log').scrollHeight;return el;}
function resetConversation(){history=[];$('log').replaceChildren();const p=document.createElement('p');p.className='empty';p.id='empty';p.textContent='Ask a question about this simulation.';$('log').append(p);$('error').textContent='';}
function sync(){$('send').disabled=busy||!runId;$('run').disabled=busy;$('question').disabled=busy;$('clear').disabled=busy;document.querySelectorAll('#suggestions button').forEach(b=>b.disabled=busy||!runId);}
function showRun(){const r=runs.find(x=>x.run_id===runId);$('facts').replaceChildren();if(!r){$('runInfo').textContent='No saved simulation: start one from the Simulation page.';$('title').textContent='Conversation';return;}
  $('title').textContent='Conversation · '+(names[r.controller]||r.controller)+' · seed '+r.seed;
  $('runInfo').textContent=`${names[r.controller]||r.controller} · ${r.scenario} · seed ${r.seed} · ${fmt(r.actual_seconds??r.seconds,0)} s · ${statuses[r.status]||r.status}`+(r.controller==='interactive'?' — the method changed during the simulation.':'');
  for(const [label,v,u] of [['CO₂',r.co2_kg,'kg'],['NOx',r.nox_g,'g'],['Fuel',r.fuel_kg,'kg'],['PM',r.pmx_g,'g'],['Mean waiting',r.mean_wait_s,'s'],['Arrived / departed',r.arrived!=null?fmt(r.arrived,0)+' / '+fmt(r.departed,0):null,'']]){const f=document.createElement('div');f.className='fact';const s=document.createElement('span');s.textContent=label;const b=document.createElement('b');b.textContent=(typeof v==='string'?v:fmt(v))+(v!=null&&u?' '+u:'');f.append(s,b);$('facts').append(f);}}
async function loadRuns(keep=true){const s=await fetch('/api/state',{cache:'no-store'}).then(r=>r.json());
  runs=(s.results||[]).filter(r=>r.run_id&&(r.actual_seconds??0)>0).sort((a,b)=>(b.created_utc||'').localeCompare(a.created_utc||''));
  if(s.live?.run_id&&!runs.some(r=>r.run_id===s.live.run_id))runs.unshift(s.live);
  const previous=runId;$('run').replaceChildren(...runs.map(r=>{const o=document.createElement('option');o.value=r.run_id;o.textContent=`${when(r)} · ${names[r.controller]||r.controller} · seed ${r.seed} · ${fmt(r.actual_seconds??r.seconds,0)} s · ${statuses[r.status]||r.status}`;return o;}));
  const wanted=new URLSearchParams(location.search).get('run');
  runId=keep&&previous&&runs.some(r=>r.run_id===previous)?previous:runs.some(r=>r.run_id===wanted)?wanted:runs[0]?.run_id??null;
  if(runId)$('run').value=runId;if(runId!==previous)resetConversation();showRun();sync();}
async function ask(question){question=question.trim();if(!question||!runId||busy)return;busy=true;sync();$('error').textContent='';bubble('user',question);$('question').value='';
  const wait=bubble('assistant','Analysing the measurements… (10 to 30 seconds)');wait.classList.add('waiting');const id=runId;
  try{const a=await post('/api/chat',{run_id:id,question,history});wait.remove();
    bubble('assistant',a.answer,`Measurements up to ${fmt(a.observed_until_s,0)} s · ${statuses[a.simulation_status]||a.simulation_status}`+(a.cached?' · reused answer':''));
    history.push({role:'user',text:question.slice(0,800)},{role:'assistant',text:a.answer.slice(0,800)});history=history.slice(-4);}
  catch(err){wait.remove();$('error').textContent=err.message;$('question').value=question;}
  finally{busy=false;sync();$('question').focus();}}
$('form').onsubmit=e=>{e.preventDefault();ask($('question').value);};
$('question').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask($('question').value);}};
$('run').onchange=()=>{runId=$('run').value;resetConversation();showRun();sync();};
$('clear').onclick=()=>{resetConversation();sync();};
$('suggestions').replaceChildren(...SUGGESTIONS.map(q=>{const b=document.createElement('button');b.type='button';b.textContent=q;b.onclick=()=>ask(q);return b;}));
loadRuns(false).catch(()=>{$('error').textContent='Dashboard server unavailable.';});
// New simulations appear in the list without changing the one being discussed.
setInterval(()=>{if(!busy)loadRuns(true).catch(()=>{});},15000);
</script>
</body></html>
