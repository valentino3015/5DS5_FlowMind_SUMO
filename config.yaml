# FlowMind settings. All numbers live here, never in the code.
# Units: seconds (s), metres (m), metres per second (m/s).

sim:
  scenario: 3x3grid   # options: 3x3grid, cologne3, corridor (run.py --scenario corridor: buses, ambulance, pedestrians)
  net_file: scenarios/3x3grid/3x3Grid2lanes.net.xml
  route_file: scenarios/3x3grid/routes14000.rou.xml
  delta_time: 5        # one decision every 5 s
  seconds: 3600        # length of one simulation
  gui: false           # true = open sumo-gui
  gui_delay: 100       # ms between steps in sumo-gui (slower = easier to watch)

signals:
  yellow: 3            # inserted automatically by env.py
  all_red: 2           # inserted automatically by env.py
  max_red_clearance: 4 # dynamic all-red hold until junction box clears (s)
  min_green: 10
  max_green: 60

shield:
  ped_clearance_speed: 0.8   # walking speed used to check a crossing is clear (m/s)
  ped_max_wait: 90           # pedestrians never wait longer than this (s)
  spillback_threshold: 0.75  # suppress green switch if ANY downstream lane exceeds this occupancy

corridor:
  order: [J1, J2, J3]       # junctions from west to east

orchestrator:
  priority: [emergency, incident, pedestrian, bus, flow]   # first = most important
  min_hold: 10               # keep the chosen agent at least this long (s)
  max_decision_ms: 50        # real-time budget for one decision (backup idea 4)

coordinator:
  horizon: 60                # warn junctions an ambulance reaches within this time (s)
  min_speed: 2               # speed used for the ETA when the ambulance is (almost) stopped (m/s)
  margin: 5                  # a warning stays valid this long after the ETA (s)
  incident_ttl: 30           # how long an incident warning stays valid (s)
  # Spillback warning (core idea 5). IDEAS.md says 85 %, but in SUMO a fully jammed lane only
  # reads about 0.67 (car length vs. gaps) and stuck cars are removed after 60 s. Measured on the
  # corridor (seed 1, 30 min): normal 0.25, road closure 0.43, double demand 0.51. 0.4 = about 60 %
  # of a jammed lane.
  spillback_occupancy: 0.4

agents:
  emergency: demo            # demo = Adem's demo rule (agents/demo_rules.py), team = agents/emergency.py

# --- one section per agent (placeholder values: each owner tunes their own) ---

fixed_time:
  green: 30                  # green time per phase (s)

green_wave:                  # static green wave along corridor.order (core idea 6, safe version)
  green: 30                  # green time per phase (s)
  link_length: 200           # distance between neighbouring junctions (m)
  speed: 13.89               # free-flow speed on the main road (m/s): offset = 200 / 13.89 = 14.4 s

max_pressure: {}             # no parameters

flow:
  urgency: 0.1
  model_path: runs/models/flow_ppo.zip   # trained PPO model (not on GitHub)
  max_queue: 25.0
  max_wait: 120.0

emergency:
  detect_distance: 200       # react when the vehicle is closer than this (m)
  preclear_eta: 20           # take control when a warned ambulance arrives within this time (s)

bus:
  min_delay: 60              # help buses that are at least this late (s)
  detect_distance: 150       # react when the bus is closer than this (m)

pedestrian:
  min_waiting: 1             # at least this many people waiting
  max_wait: 60               # ask for control after this wait (s)

incident:
  halt_time: 60              # a lane stopped this long may be blocked (s)
  min_queue: 5               # halting vehicles needed to suspect an incident

overlay:                     # sumo-gui labels: color of the dot per agent in control (RGBA)
  default_color: [128, 128, 128, 255]
  colors:
    emergency: [220, 0, 0, 255]
    incident: [255, 140, 0, 255]
    pedestrian: [150, 0, 200, 255]
    bus: [0, 120, 255, 255]
    flow: [0, 170, 0, 255]
    max_pressure: [128, 128, 128, 255]
    fixed_time: [80, 80, 80, 255]
    operator: [0, 0, 0, 255]

xai:                         # explanation layer (xai/, scripts/explain.py), never controls a light
  llm_url: http://localhost:11434   # local Ollama server (optional: without it, template answers are used)
  llm_model: qwen2.5:3b      # small local model (1.9 GB, chosen over gemma3:4b in tests); only rewords facts
  llm_timeout_s: 120         # give up and use the template answer after this (s)
  max_rows: 4                # at most this many log decisions retrieved per question (small model: keep it short)
  perturb_cars: 5            # sensitivity: cars added to a lane in the "more cars" test

evaluation:
  seeds: [100, 101, 102, 103, 104, 105, 106, 107, 108, 109]
